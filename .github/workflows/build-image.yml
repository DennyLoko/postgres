name: build-image

# Builds the image and pushes it to GHCR as ghcr.io/<owner>/postgres.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "Dockerfile"
      - ".github/workflows/build-image.yml"
  # Weekly rebuild to pick up Postgres, pgvector and pg_partman patch releases.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/postgres
          tags: |
            type=raw,value=pg17,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Smoke test: the published image starts and both extensions can be created.
      - name: Smoke test
        run: |
          # Use the sha tag from metadata-action: it is already lowercased, and Docker
          # rejects image references with uppercase letters (e.g. the repository owner).
          img=$(echo '${{ steps.meta.outputs.tags }}' | tr ' ' '\n' | grep ':sha-')
          docker run -d --name pg -e POSTGRES_PASSWORD=x "$img" -c shared_preload_libraries=pg_stat_statements,pg_partman_bgw
          for i in $(seq 1 30); do docker exec pg pg_isready -U postgres -q && break; sleep 1; done
          sleep 2
          docker exec pg psql -U postgres -v ON_ERROR_STOP=1 -c "create extension vector; create schema partman; create extension pg_partman schema partman; select extname, extversion from pg_extension order by 1;"
